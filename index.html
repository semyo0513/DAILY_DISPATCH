<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 융합교육 매거진</title>
<meta name="description" content="Gmail로 수신되는 AI 융합교육 브리핑 메일을 매거진처럼 읽는 웹앱" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='80'%3E%F0%9F%93%A1%3C/text%3E%3C/svg%3E" />

<!-- 폰트: Gowun Batang(제목용 세리프), Roboto Mono(날짜/수치용), Pretendard(본문 한글 산세리프) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

<link rel="stylesheet" href="style.css" />

<!-- HTML 새니타이저: 메일 본문(외부 HTML)을 안전하게 표시하기 위해 사용 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" integrity="sha512-Bnbnn/o4dpiO0jz1kaKzaqfnQd90LM3pDcMc3ry3QC4TnhBnw9WWt9kx/T4tuxbmyfCbHi+p1E17ImOaN1yLTQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<!-- Google Identity Services: Gmail OAuth 로그인 -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<header class="masthead">
  <div class="masthead__top">
    <span class="eyebrow">DAILY DISPATCH · AI 융합교육</span>
    <div class="masthead__actions">
      <span id="syncStatus" class="sync-status">불러오지 않음</span>
      <button id="btnRefresh" class="icon-btn" title="새로고침" aria-label="새로고침">⟳</button>
      <button id="btnSettings" class="icon-btn" title="설정" aria-label="설정">⚙</button>
      <button id="btnAuth" class="btn btn--primary">Google로 로그인</button>
    </div>
  </div>
  <h1 class="masthead__title">AI 융합교육 매거진</h1>
  <p class="masthead__subtitle">Gmail로 도착한 AI 융합교육 브리핑을, 매거진처럼 넘겨 읽습니다.</p>

  <div class="toolbar">
    <input id="searchInput" class="search-input" type="search" placeholder="제목·요약 검색" autocomplete="off" />
    <select id="categoryFilter" class="category-select">
      <option value="">전체 분류</option>
    </select>
  </div>
</header>

<main id="main">
  <div id="emptyState" class="empty-state" hidden>
    <p class="empty-state__title">아직 표시할 브리핑이 없습니다</p>
    <p class="empty-state__body">오른쪽 위 설정(⚙)에서 Client ID와 검색 조건을 확인한 뒤, Google로 로그인해 새로고침해 보세요.</p>
    <button id="btnEmptySettings" class="btn">설정 열기</button>
  </div>

  <div id="grid" class="grid" aria-live="polite"></div>

  <div id="loadMoreWrap" class="load-more-wrap" hidden>
    <button id="btnLoadMore" class="btn">이전 브리핑 더 불러오기</button>
  </div>
</main>

<!-- 상세 보기 모달 -->
<div id="detailOverlay" class="overlay" hidden>
  <div class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detailHeadline">
    <div class="detail-panel__header">
      <div>
        <span id="detailCategory" class="chip"></span>
        <span id="detailDate" class="mono meta-text"></span>
      </div>
      <button id="btnCloseDetail" class="icon-btn" aria-label="닫기">✕</button>
    </div>
    <h2 id="detailHeadline" class="detail-panel__headline"></h2>
    <div id="detailMeta" class="meta-text mono"></div>
    <div id="detailBody" class="detail-panel__body">
      <div class="skeleton skeleton--text"></div>
      <div class="skeleton skeleton--text"></div>
      <div class="skeleton skeleton--text short"></div>
    </div>
    <div class="detail-panel__footer">
      <a id="detailGmailLink" href="#" target="_blank" rel="noopener noreferrer" class="link-arrow">Gmail에서 원문 보기 →</a>
    </div>
  </div>
</div>

<!-- 설정 모달 -->
<div id="settingsOverlay" class="overlay" hidden>
  <div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="detail-panel__header">
      <h2 id="settingsTitle" class="settings-panel__title">설정</h2>
      <button id="btnCloseSettings" class="icon-btn" aria-label="닫기">✕</button>
    </div>

    <form id="settingsForm" class="settings-form">
      <label class="field">
        <span class="field__label">Google OAuth Client ID <span class="required">필수</span></span>
        <input id="fClientId" type="text" placeholder="xxxxxxxx.apps.googleusercontent.com" autocomplete="off" />
        <span class="field__hint">Google Cloud Console에서 발급한 웹 애플리케이션용 클라이언트 ID를 입력하세요. (README.md 참고)</span>
      </label>

      <label class="field">
        <span class="field__label">제목 검색 키워드</span>
        <input id="fKeyword" type="text" placeholder="AI 융합교육" />
        <span class="field__hint">메일 제목에 포함된 고정 단어입니다. 제목 형식이 바뀌어도 이 단어만 유지되면 계속 검색됩니다.</span>
      </label>

      <label class="field">
        <span class="field__label">발신자 (선택)</span>
        <input id="fSender" type="text" placeholder="news@example.com" autocomplete="off" />
        <span class="field__hint">발신 주소를 알고 있다면 입력하세요. 제목이 완전히 바뀌어도 가장 안정적으로 필터링됩니다.</span>
      </label>

      <label class="field">
        <span class="field__label">한 번에 불러올 개수</span>
        <select id="fMaxResults">
          <option value="10">10개</option>
          <option value="20" selected>20개</option>
          <option value="30">30개</option>
          <option value="50">50개</option>
        </select>
      </label>

      <div class="settings-form__actions">
        <button type="button" id="btnResetCache" class="btn btn--ghost">캐시 초기화</button>
        <button type="submit" class="btn btn--primary">저장</button>
      </div>
    </form>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
